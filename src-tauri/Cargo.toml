[package]
name = "data-editor"
version = "0.1.0"
description = "Spreadsheet-style data entry tool for Parquet data"
edition = "2021"
rust-version = "1.77"

[lib]
name = "data_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
