[package]
name = "herringbone"
version = "0.1.0"
description = "Herringbone — spreadsheet-style editor for Parquet data"
edition = "2021"
rust-version = "1.77"

[lib]
name = "herringbone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
